name: Vocab Web Push (아이 아이폰 알림)

on:
  schedule:
    - cron: '0 7 * * *'      # 매일 KST 16:00 — 학습 시작 알림
    - cron: '0 11 * * *'     # 매일 KST 20:00 — 미완료 리마인드
    - cron: '0 2 * * 6,0'    # 토·일 KST 11:00 — 테스트/용돈 미션
  workflow_dispatch:
    inputs:
      mode:
        description: '발송 모드'
        type: choice
        default: 'test'
        options: [test, start, remind, mission]
      dry_run:
        description: '실제 발송 없이 내용만 확인'
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send web push
        env:
          VOCA_API_KEY: ${{ secrets.VOCA_API_KEY }}
          VOCA_PUSH_ADMIN: ${{ secrets.VOCA_PUSH_ADMIN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          SCHED="${{ github.event.schedule }}"
          MODE="${{ github.event.inputs.mode }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi

          if [ -n "$MODE" ]; then
            python vocab_push.py --$MODE $DRY
          elif [ "$SCHED" = "0 7 * * *" ]; then
            python vocab_push.py --start
          elif [ "$SCHED" = "0 11 * * *" ]; then
            python vocab_push.py --remind
          else
            python vocab_push.py --mission
          fi
