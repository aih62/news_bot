name: Vocab Study Kakao Report

on:
  schedule:
    # 매일 한국시간 오후 9시 (UTC 12:00). 일요일에는 주간 리포트도 함께 발송됩니다.
    - cron: '0 12 * * *'
  workflow_dispatch:      # 수동 실행 버튼
    inputs:
      mode:
        description: '발송 모드 (auto / daily / weekly)'
        type: choice
        default: 'auto'
        options: [auto, daily, weekly]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send vocab study report to KakaoTalk
        env:
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # refresh token 회전 시 Secret 자동 저장용 (기존 뉴스 알림과 동일)
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 선택: 설정 시 api.php 토큰 override (미설정 시 스크립트 기본값 사용)
          VOCA_API_KEY: ${{ secrets.VOCA_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="auto"; fi
          python vocab_report_kakao.py --$MODE
