name: Daily Security News Update

on:
  schedule:
    # 매일 한국 시간 오전 5시 38분 (UTC 20:38)에 실행
    #  ※ 정각(:00)은 GitHub cron이 가장 많이 지연·누락시키므로 비정각 분으로 등록
    - cron: '38 20 * * *'
  workflow_dispatch: # 직접 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    # 설치/실행이 멈춰도 6시간(기본값) 동안 매달리지 않고 빠르게 실패하도록 상한을 둔다.
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        # auto_wp_news.py 전용 최소 의존성만 설치(불필요한 무거운 패키지 제외로 pip 행 방지)
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-news.txt

      - name: Install Playwright browser (optional image-extraction fallback)
        # 브라우저 기반 이미지 추출은 '폴백'일 뿐이라 없어도 스크립트는 정상 실행된다.
        # --with-deps(apt 설치)가 러너 이미지 변경 등으로 멈출 수 있어, 타임아웃 + 비치명으로
        # 두어 이 단계가 실패/지연돼도 본 스크립트(Run script)는 반드시 실행되게 한다.
        timeout-minutes: 8
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: playwright install chromium --with-deps

      - name: Run script
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: python auto_wp_news.py
