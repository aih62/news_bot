name: Vocab Study Kakao Report

on:
  schedule:
    - cron: '0 11 * * *'   # 매일 KST 20:00 — 미완료 리마인드
    - cron: '0 12 * * *'   # 매일 KST 21:00 — 오늘 요약 (일요일엔 주간 리포트도)
  workflow_dispatch:
    inputs:
      mode:
        description: '발송 모드'
        type: choice
        default: 'auto'
        options: [auto, daily, weekly, remind, complete]
      kid:
        description: "complete 모드 대상 (k1=둘째, k2=첫째)"
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send vocab report to KakaoTalk
        env:
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VOCA_API_KEY: ${{ secrets.VOCA_API_KEY }}
          COMPLETE_KID: ${{ github.event.inputs.kid }}
        run: |
          SCHED="${{ github.event.schedule }}"
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$MODE" ]; then
            python vocab_report_kakao.py --$MODE
          elif [ "$SCHED" = "0 11 * * *" ]; then
            python vocab_report_kakao.py --remind
          else
            python vocab_report_kakao.py --auto
          fi
