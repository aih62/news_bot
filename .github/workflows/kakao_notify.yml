name: KakaoTalk News Notification

on:
  # 시각 크론 대신 게시 워크플로 완료 직후로 체이닝한다.
  #  GitHub 예약 실행이 2026-08 말부터 상시 1.5~6시간 지연되어, 07:21 KST 예정이
  #  실제로는 09시 전후에 돌거나(2026-09-08처럼) 아예 누락됐다. 두 워크플로가
  #  각각 독립적으로 지연되면 알림이 게시보다 먼저 도는 순서 역전도 발생할 수 있다.
  workflow_run:
    workflows: ["Daily Security News Update"]
    types: [completed]
  schedule:
    # 백스톱 안전망: 게시 워크플로 자체가 누락되면 위 체이닝이 발동하지 않아
    #  알림까지 조용히 침묵한다. 그런 날을 잡아내기 위한 늦은 시각 예약이며,
    #  당일 이미 성공한 알림이 있으면 아래 guard 스텝이 건너뛴다.
    #  12:17 KST(03:17 UTC) 예정 — 지연을 감안해도 정상 경로가 끝난 뒤다.
    - cron: '17 3 * * *'
  workflow_dispatch: # 직접 실행 버튼
    inputs:
      verify_secret_save:
        description: 'GH_PAT의 Secret 쓰기 권한만 검증 (카카오톡 전송 안 함)'
        type: boolean
        default: false

jobs:
  notify:
    # 게시가 실패한 날에도 알림은 보낸다(당일 0건 통지가 곧 장애 신호가 된다).
    # 취소된 실행에만 반응하지 않는다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # guard 스텝이 당일 알림 실행 이력을 조회하는 데 필요
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 오늘 이미 발송했는지 확인 (백스톱 크론 전용)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cutoff는 KST 자정을 UTC로 환산한 값이어야 한다.
          #  date -u 는 TZ 환경변수를 덮어써 UTC 자정을 주므로 쓰지 않는다. 그 실수로
          #  23시 UTC(=익일 08시 KST)에 도는 체이닝 실행이 집계에서 빠져, 백스톱이
          #  2026-09-15~28 내내 아침에 이어 저녁에도 중복 전송했다.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow kakao_notify.yml --limit 50 --json createdAt,conclusion)
          summary=$(printf '%s' "$runs" | python3 -c 'import datetime as d, json, sys; k=d.timezone(d.timedelta(hours=9)); since=d.datetime.now(k).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(d.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"); rows=json.load(sys.stdin); print(since, sum(1 for r in rows if r.get("conclusion")=="success" and r.get("createdAt","")>=since))')
          since=${summary% *}
          sent=${summary##* }
          echo "KST 자정($since UTC) 이후 성공한 알림 실행: ${sent}건"

          # 조회가 실패했는데 0으로 읽히면 매일 중복 전송한다. 판단 불가면 실패시킨다.
          case "$sent" in
            ''|*[!0-9]*)
              echo "알림 이력 조회 실패(sent='$sent'). 중복 전송을 막기 위해 실패 종료합니다."
              exit 1
              ;;
          esac

          if [ "$sent" -gt 0 ]; then
            echo "오늘 알림이 이미 나갔습니다. 백스톱을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "오늘 알림 기록이 없습니다. 백스톱으로 발송합니다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kakao Notification
        # guard는 schedule 이벤트에서만 돌며, 그 외 이벤트에서는 출력이 비어 있어 항상 실행된다.
        if: steps.guard.outputs.skip != 'true'
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # 회전된 refresh token을 KAKAO_TOKEN_JSON Secret에 자동 저장하기 위한 PAT
          # (secrets:write 권한 필요. 미설정 시 자동 저장만 건너뛰고 알림은 정상 동작)
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 0건 안내에 원인을 함께 싣기 위해 게시 실행의 결과를 넘긴다.
          #  (schedule/workflow_dispatch로 돌 때는 비어 있어 안내 문구가 붙지 않는다)
          PUBLISH_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PUBLISH_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "${{ inputs.verify_secret_save }}" = "true" ]; then
            python kakao_summary.py --verify-secret-save
          else
            python kakao_summary.py
          fi
