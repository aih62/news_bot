name: KakaoTalk News Notification

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00)에 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 직접 실행 버튼

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kakao Notification
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # 회전된 refresh token을 KAKAO_TOKEN_JSON Secret에 자동 저장하기 위한 PAT
          # (secrets:write 권한 필요. 미설정 시 자동 저장만 건너뛰고 알림은 정상 동작)
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python kakao_summary.py
